name: monitor (盤中監控)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run monitor.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated data
        run: |
          git config user.name "tw-stock-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git add watchlist_conditions.json 2>/dev/null || true
          git add alerted.json 2>/dev/null || true
          git add morning_watchlist_*.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: monitor 自動更新資料 [skip ci]"
          git pull --rebase --autostash
          git push
